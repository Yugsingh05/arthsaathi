# ArthSaathi — development stack. Source is bind-mounted, both halves reload.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Edit a .py file and uvicorn restarts; edit a .jsx file and Vite hot-reloads.
# State is in Postgres, so both halves talk to the same database your host
# tooling does. Note that a reload re-reads the whole transactions table, which
# costs about 25s.
#
# Same two independent images as the built stack, just different targets and
# mounts — the Dockerfiles still live in backend/ and frontend/.

name: arthsaathi-dev

services:
  api:
    build:
      context: ./backend
      target: runtime
      additional_contexts:
        dataset: ./data
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app/backend
    # the venv lives at /opt/venv, outside /app, so the bind mount above
    # cannot shadow it
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      # the Vite proxy has to reach the API by service name, not localhost
      VITE_API_PROXY: http://api:8000
    volumes:
      - ./frontend:/app
      # keep the image's Linux node_modules; the host's are built for macOS
      - dev-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  dev-node-modules:
