# The web app on its own — no API container, no repo-root file involved.
#
#   cd frontend && docker compose up --build
#
# http://localhost:5173. /api is proxied to whatever API_UPSTREAM points at;
# by default that is port 8000 on the host, so this works against `uv run
# uvicorn` on your machine or against `cd backend && docker compose up`.
#
#   API_UPSTREAM=http://staging.internal:8000 docker compose up

name: arthsaathi-web

services:
  web:
    build:
      context: .
      target: runtime
    image: arthsaathi-web:latest
    ports:
      - "5173:5173"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8000}
    extra_hosts:
      # lets the default upstream above resolve to the host on Linux too
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
