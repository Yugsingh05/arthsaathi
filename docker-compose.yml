# ArthSaathi — both halves, wired together. One command, nothing installed on
# the host.
#
#   docker compose up --build
#
# web  http://localhost:5173   api  http://localhost:8000/docs
#
# Each service builds from its own directory with its own Dockerfile and its
# own .dockerignore — this file only connects them. Either half also runs
# alone: `cd backend && docker compose up` or `cd frontend && docker compose up`.
#
# State lives in Postgres, not in this stack: the dataset, the consent and
# decision ledger and the trained model are all rows in the database named by
# backend/.env, so there are no volumes here and nothing to lose on `down`.
# Boot migrates, checks the dataset is loaded, checks a model exists, and
# serves. The web container waits for the API's healthcheck, so the page is
# never served against a half-ready backend.

name: arthsaathi

services:
  api:
    build:
      context: ./backend
      target: runtime
      additional_contexts:
        # data/ sits beside backend/, so it is handed in rather than being part
        # of the context. The committed dataset ships in the image and a fresh
        # volume is seeded from it — nothing is generated on boot.
        dataset: ./data
    image: arthsaathi-api:latest
    # DATABASE_URL and friends; see backend/.env.example
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: runtime
    image: arthsaathi-web:latest
    ports:
      - "5173:5173"
    environment:
      # here the API is a sibling container, reachable by service name
      API_UPSTREAM: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
