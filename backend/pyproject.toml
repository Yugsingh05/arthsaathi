[project]
name = "arthsaathi-backend"
version = "0.1.0"
description = "ArthSaathi - AI-powered hyper-personalized banking layer for Bharat (HackOut'26)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    # data generation + storage
    "faker>=26.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    # models + explainability
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    # policy rules
    "pyyaml>=6.0",
]

[tool.uv]
package = false
