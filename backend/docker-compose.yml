# The API on its own — no frontend, no repo-root file involved.
#
#   cd backend && docker compose up --build
#
# Docs at http://localhost:8000/docs. Everything is in Postgres, so this needs
# no volumes and shares its state with every other stack pointed at the same
# DATABASE_URL — including the full-stack file one directory up.

name: arthsaathi-api

services:
  api:
    build:
      context: .
      target: runtime
      additional_contexts:
        # the committed dataset, baked in so boot needs no generation
        dataset: ../data
    image: arthsaathi-api:latest
    # DATABASE_URL and friends; see .env.example
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    restart: unless-stopped
