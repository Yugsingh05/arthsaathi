# ArthSaathi — SonarCloud analysis config
# Docs: https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-parameters/

sonar.projectKey=Yugsingh05_arthsaathi
sonar.organization=yugsingh05
sonar.projectName=ArthSaathi
sonar.projectVersion=0.1.0

# --- what to analyse -------------------------------------------------------
sonar.sources=backend/app,backend/scripts,frontend/src
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# --- what to skip ----------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/*.min.js,\
  frontend/public/**,\
  frontend/src/assets/**,\
  data/**,\
  backend/models/**

# No test suite yet. Without this, Coverage on New Code is 0% and the
# default quality gate fails (required >= 80%).
sonar.coverage.exclusions=**/*

# EN/HI/GU language tables repeat the same keys; that trips Duplication
# on New Code (required <= 3%) even though it is not copied business logic.
sonar.cpd.exclusions=\
  frontend/src/i18n.js,\
  backend/app/i18n/templates.py

# --- tests + coverage (uncomment when you add a test suite) ------
# sonar.tests=backend/tests,frontend/src/__tests__
# sonar.python.coverage.reportPaths=backend/coverage.xml
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
